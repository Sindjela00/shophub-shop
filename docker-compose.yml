# Local development infrastructure. Matches backend/src/Shop.Api/appsettings.Development.json.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
    ports:
      - "5432:5432"
    volumes:
      - shop-postgres-data:/var/lib/postgresql/data

volumes:
  shop-postgres-data:
